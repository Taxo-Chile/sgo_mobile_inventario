<ion-header>
  <ion-toolbar>
    <ion-title>SGO Inventario</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <div class="page-inner">
    <div class="flex flex-col gap-2">
      <h1 class="page-title">Bienvenido</h1>
      <p class="page-subtitle">Ingresa tus credenciales para continuar</p>
    </div>

    <div class="flex flex-col gap-4">
      <div class="flex flex-col gap-2">
        <span class="field-label" id="login-rut-label">RUT</span>
        <ion-input
          id="login-rut"
          class="input-base"
          aria-label="RUT"
          aria-labelledby="login-rut-label"
          placeholder="Ej: 12345678-5"
          inputmode="text"
          enterkeyhint="next"
          maxlength="12"
          autocomplete="username"
          [attr.aria-invalid]="errorMessage() && !rut() ? 'true' : null"
          [value]="rut()"
          (ionInput)="rut.set($event.detail.value!); clearError()"
          (keyup.enter)="onLogin()"
        ></ion-input>
      </div>

      <div class="flex flex-col gap-2">
        <span class="field-label" id="login-password-label">Contraseña</span>
        <ion-input
          id="login-password"
          class="input-base"
          aria-label="Contraseña"
          aria-labelledby="login-password-label"
          type="password"
          placeholder="••••••"
          enterkeyhint="go"
          autocomplete="current-password"
          [value]="password()"
          (ionInput)="password.set($event.detail.value!); clearError()"
          (keyup.enter)="onLogin()"
        ></ion-input>
      </div>

      @if (errorMessage()) {
        <div class="error-pill" id="login-error" role="alert" aria-live="assertive">
          <ion-icon name="alert-circle-outline" aria-hidden="true"></ion-icon>
          <span>{{ errorMessage() }}</span>
        </div>
      }

      <ion-button
        class="btn-primary"
        type="button"
        [disabled]="loading() || !rut() || !password()"
        (click)="onLogin()"
      >
        @if (loading()) {
          <ion-spinner name="crescent" slot="start"></ion-spinner>
          Ingresando...
        } @else {
          Iniciar Sesión
        }
      </ion-button>
    </div>

    <p class="version-app">SGO Tablet v0.1.0</p>
  </div>
</ion-content>
